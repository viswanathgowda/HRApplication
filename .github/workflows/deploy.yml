name: 🚀 Deploy HR Application to GitHub Pages

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - UAT
      - live
    types: [closed]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/dev' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
      (github.base_ref == 'UAT' || github.base_ref == 'live'))

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Angular project
        run: |
          APP_NAME=$(basename $GITHUB_REPOSITORY)

          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            BASE_HREF="/${APP_NAME}/dev/"
          elif [[ "${GITHUB_BASE_REF}" == "UAT" ]]; then
            BASE_HREF="/${APP_NAME}/uat/"
          else
            BASE_HREF="/${APP_NAME}/"
          fi

          echo "🛠 Updating base href to ${BASE_HREF}"
          sed -i "s|<base href=\"/\">|<base href=\"${BASE_HREF}\">|" src/index.html

          npm run build --if-present -- --configuration production

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          # 🔥 Confirm actual folder: Angular 17+ builds go to dist/<app-name>/browser
          publish_dir: ./dist/hr/browser
          destination_dir: ${{ github.ref_name == 'dev' && 'dev' || (github.base_ref == 'UAT' && 'uat') || (github.base_ref == 'live' && '') }}
