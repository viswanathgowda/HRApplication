name: 🚀 Deploy HR Application to GitHub Pages

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - UAT
      - live
    types: [closed]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/dev' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
      (github.base_ref == 'UAT' || github.base_ref == 'live'))

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: |
          if [[ $GITHUB_REF == "refs/heads/dev" ]]; then
            sed -i 's|<base href="/">|<base href="/${{ github.event.repository.name }}/dev/">|' src/index.html
          elif [[ $GITHUB_BASE_REF == "UAT" ]]; then
            sed -i 's|<base href="/">|<base href="/${{ github.event.repository.name }}/uat/">|' src/index.html
          else
            sed -i 's|<base href="/">|<base href="/${{ github.event.repository.name }}/">|' src/index.html
          fi
          npm run build --if-present

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/<your-app-name>
          publish_branch: gh-pages
          destination_dir: |
            ${{ github.ref_name == 'dev' && 'dev' ||
                (github.base_ref == 'UAT' && 'uat') ||
                (github.base_ref == 'live' && '') }}
