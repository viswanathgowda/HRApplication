<p-toast /> 
<div class="mb-4">
  <p-card header="Create Role">
    <div class="flex align-items-center gap-2 mb-3">
      <input
        pInputText
        placeholder="Role name"
        [(ngModel)]="newRole"
        class="w-full md:w-20rem"
      />
      <button
        pButton
        label="Add Role"
        icon="pi pi-plus"
        (click)="addRole()"
      ></button>
    </div>

    <p-listbox
      [options]="roles"
      optionLabel="name"
      [(ngModel)]="selectedRole"
      (onChange)="loadPermissions()"
    ></p-listbox>
  </p-card>
</div>

<div class="mb-4">
  <p-card header="Create Permission Tabs">
    <div class="flex align-items-center gap-2 mb-3">
      <input
        pInputText
        placeholder="Tab name (Users, Reports...)"
        [(ngModel)]="newTab"
        class="w-full md:w-20rem"
      />
      <button
        pButton
        label="Add Tab"
        icon="pi pi-plus"
        (click)="addTab()"
      ></button>
    </div>

    <div class="flex flex-wrap gap-2">
      <p-chip *ngFor="let tab of tabs" [label]="tab.name"></p-chip>
    </div>
  </p-card>
</div>

<div class="mb-4">
  <p-card header="Assign Permissions">
    <!-- 🔔 INFO STATE -->
    <div
      *ngIf="!selectedRole"
      class="flex align-items-center gap-2 p-3 border-round surface-100 text-700"
    >
      <i class="pi pi-info-circle text-blue-500 text-xl"></i>
      <span> Please select a role to assign permissions. </span>
    </div>

    <!-- ✅ PERMISSIONS TABLE -->
    <ng-container *ngIf="selectedRole">
      <p-table [value]="permissions" responsiveLayout="scroll">
        <ng-template pTemplate="header">
          <tr>
            <th>Tab</th>
            <th>Role</th>
            <th class="text-center">View</th>
            <th class="text-center">Create</th>
            <th class="text-center">Edit</th>
            <th class="text-center">Delete</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-perm>
          <tr>
            <td>{{ perm.tabName }}</td>
            <td>{{ perm.role }}</td>

            <td class="text-center">
              <p-checkbox [(ngModel)]="perm.view" binary="true"></p-checkbox>
            </td>
            <td class="text-center">
              <p-checkbox [(ngModel)]="perm.create" binary="true"></p-checkbox>
            </td>
            <td class="text-center">
              <p-checkbox [(ngModel)]="perm.edit" binary="true"></p-checkbox>
            </td>
            <td class="text-center">
              <p-checkbox [(ngModel)]="perm.delete" binary="true"></p-checkbox>
            </td>
          </tr>
        </ng-template>
      </p-table>

      <div class="flex justify-content-end mt-3">
        <button
          pButton
          label="Save Permissions"
          icon="pi pi-save"
          (click)="savePermissions()"
        ></button>
      </div>
    </ng-container>
  </p-card>
</div>
